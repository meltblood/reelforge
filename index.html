<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReelForge">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ReelForge</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brandline">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 5h11M7 12h8M7 19V5"/></svg>
        </span>
        <div class="brand">ReelForge</div>
      </div>
    </header>

    <section class="panel upload-panel">
      <input id="fileInput" type="file" accept="video/*,image/*" hidden>
      <button id="pickBtn" class="dropzone" type="button">
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </span>
        <span class="drop-title">Выбрать фото или видео</span>
        <span class="drop-note">Файл обрабатывается на этом устройстве</span>
      </button>
      <div id="fileMeta" class="file-meta hidden"></div>
    </section>

    <section class="panel controls">
      <div class="section-head">
        <h2>Режим</h2>
        <span id="sourceFingerprint" class="mono muted"></span>
      </div>
      <div class="segmented" id="modeControl">
        <button data-mode="light">Лёгкая</button>
        <button data-mode="medium">Средняя</button>
        <button data-mode="strong" class="active">Сильная</button>
        <button data-mode="manual">Вручную</button>
      </div>

      <div class="section-head preset-head">
        <h2>Пресет</h2>
        <div class="head-actions">
          <button id="randomizeBtn" class="link-btn icon-btn" type="button" title="Случайные параметры">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h2.5c4.5 0 5 10 9.5 10H20"/><path d="M17 14l3 3-3 3"/><path d="M4 17h2.5c1.6 0 2.7-1.3 3.7-3"/><path d="M13.8 10c.7-1.7 1.3-3 2.2-3H20"/><path d="M17 4l3 3-3 3"/></svg>
            <span>Рандом</span>
          </button>
          <button id="savePresetBtn" class="link-btn icon-btn" type="button" title="Сохранить текущий пресет">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>
            <span>Сохранить</span>
          </button>
        </div>
      </div>
      <select id="presetSelect" class="input"></select>

      <div class="grid two compact-row">
        <label>Количество вариантов
          <select id="variantCount" class="input">
            <option value="1">1</option>
            <option value="3">3</option>
            <option value="5">5</option>
          </select>
        </label>
        <label>Формат
          <select id="formatSelect" class="input">
            <option value="reels">Reels 9:16</option>
            <option value="original">Исходное соотношение</option>
          </select>
        </label>
      </div>

      <details id="manualDetails" class="advanced">
        <summary>Диапазоны обработки</summary>
        <div id="rangeGrid" class="range-grid"></div>
      </details>

      <div class="switches">
        <label class="switch-row"><input id="preserveAudio" type="checkbox" checked><span>Сохранить звук</span></label>
        <label class="switch-row"><input id="qualityGate" type="checkbox" checked><span>Отклонять слишком похожий результат</span></label>
      </div>

      <button id="processBtn" class="primary icon-primary" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>Создать вариант</span>
      </button>
      <div class="progress-wrap hidden" id="progressWrap">
        <div class="progress-line"><span id="progressLabel">Подготовка</span><span id="progressText">0%</span></div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section id="resultsPanel" class="panel hidden">
      <div class="section-head">
        <h2>Результаты</h2>
        <button id="clearResults" class="link-btn icon-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
          <span>Очистить</span>
        </button>
      </div>
      <div id="results" class="results"></div>
    </section>

    <section class="panel info-panel">
      <div class="info-row"><span>Сеть</span><strong id="networkState">—</strong></div>
      <div class="info-row"><span>Хранение</span><strong>Только устройство</strong></div>
      <div class="info-row"><span>История рецептов</span><strong id="historyCount">0</strong></div>
    </section>

    <footer class="dev-credit">dev by meltblood</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
